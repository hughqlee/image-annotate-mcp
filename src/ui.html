<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#ffffff;--fg:#1f2328;--muted:#59636e;--btn:#f6f8fa;--btn-bd:#d1d9e0;--accent:#1f6feb;--accent-fg:#ffffff;--canvas-bd:#d1d9e0;color-scheme:light}
:root[data-theme="dark"]{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--btn:#21262d;--btn-bd:#3d444d;--accent:#4493f8;--accent-fg:#0d1117;--canvas-bd:#3d444d;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font:14px system-ui,sans-serif;margin:8px}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sep{flex:1}
button,.file{padding:4px 10px;border:1px solid var(--btn-bd);border-radius:6px;background:var(--btn);color:var(--fg);cursor:pointer;font:inherit}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.file input{display:none}
.ctl{display:inline-flex;align-items:center;gap:4px;color:var(--muted)}
.ctl[hidden]{display:none}
#color{width:28px;height:24px;padding:0;border:1px solid var(--btn-bd);border-radius:4px;background:none}
#strength{width:90px;accent-color:var(--accent)}
#st{color:var(--muted);width:100%;min-height:1.2em}
#view{max-width:100%;max-height:75vh;overflow:auto;margin-top:4px}
#view.zoomed{border:1px solid var(--canvas-bd)}
#wrap{position:relative;display:inline-block;max-width:100%;line-height:0}
#view.zoomed #wrap{max-width:none}
#view.zoomed #cv{max-width:none}
#zoom{display:inline-flex;align-items:center;gap:4px}
#zoomPct{min-width:3.5em;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
#cv{max-width:100%;image-rendering:auto;border:1px solid var(--canvas-bd);display:block;background:var(--btn)}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
#out{border:1px solid var(--btn-bd);border-radius:8px;padding:8px;margin:6px 0;background:var(--btn)}
#out[hidden]{display:none}
.outbar{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.muted,#outWhy{color:var(--muted);font-size:13px}
#outImg{display:block;max-width:100%;max-height:360px;margin-top:6px;border:1px solid var(--canvas-bd)}
#hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);line-height:1.4;pointer-events:none;text-align:center;padding:8px}
#hint[hidden]{display:none}
</style></head><body>
<div id="bar">
<label class="file"><input type="file" id="file" accept="image/*"><span data-i18n="open"></span></label>
<button data-tool="highlight" data-i18n="highlight"></button><button data-tool="rect" data-i18n="rect" aria-pressed="true"></button><button data-tool="check" data-i18n="check"></button><button data-tool="mosaic" data-i18n="mosaic"></button><button data-tool="redact" data-i18n="redact"></button>
<span id="colorBox" class="ctl"><span data-i18n="color"></span><input type="color" id="color" value="#e11d1d"></span>
<span id="strengthBox" class="ctl" hidden><span data-i18n="strength"></span><input type="range" id="strength" min="1" max="5" step="1" value="3"></span>
<button id="undo" data-i18n="undo"></button><button id="export" data-i18n="export"></button>
<span class="sep"></span>
<button id="lang" title="Language / 언어"></button><button id="theme"></button>
<span id="zoom"><button id="zoomOut" title="Zoom out (Ctrl+wheel)">−</button><span id="zoomPct">100%</span><button id="zoomIn" title="Zoom in (Ctrl+wheel)">+</button><button id="zoomFit" data-i18n="fit"></button></span>
<span id="st"></span></div>
<div id="out" hidden><div class="outbar"><strong data-i18n="outTitle"></strong><span class="sep"></span><button id="copy" data-i18n="copy"></button><button id="send" data-i18n="send"></button><button id="closeOut" data-i18n="close"></button></div>
<div id="outWhy"></div><div data-i18n="outHint" class="muted"></div><img id="outImg" alt=""></div>
<div id="view"><div id="wrap"><canvas id="cv" width="480" height="240"></canvas><canvas id="ov"></canvas><div id="hint" data-i18n="hint"></div></div></div>
<script type="module">/*BUNDLE*/</script></body></html>
